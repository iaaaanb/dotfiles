# Starship — Catppuccin Mocha

format = """
[](fg:#45475a)\
$directory\
[](fg:#45475a bg:#313244)\
$git_branch\
$git_status\
[](fg:#313244)\
$fill\
$cmd_duration\
$python\
$nodejs\
$rust\
$golang\
$line_break\
$character"""

right_format = """$time"""

[fill]
symbol = ' '

[directory]
style = "fg:#cdd6f4 bg:#45475a"
format = "[ $path ]($style)"
truncation_length = 3
truncate_to_repo = true

[directory.substitutions]
"Documents" = " "
"Downloads" = " "
"Music"     = " "
"Pictures"  = " "

[git_branch]
symbol = ""
style = "fg:#cdd6f4 bg:#313244"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "fg:#f38ba8 bg:#313244"
format = '[$all_status$ahead_behind ]($style)'

[cmd_duration]
min_time = 2000
style = "fg:#f9e2af"
format = "[  $duration ]($style)"

[python]
symbol = " "
style = "fg:#f9e2af"
format = '[ $symbol($version) ]($style)'

[nodejs]
symbol = " "
style = "fg:#a6e3a1"
format = '[ $symbol($version) ]($style)'

[rust]
symbol = " "
style = "fg:#f38ba8"
format = '[ $symbol($version) ]($style)'

[golang]
symbol = " "
style = "fg:#94e2d5"
format = '[ $symbol($version) ]($style)'

[time]
disabled = false
time_format = "%R"
style = "fg:#7f849c"
format = '[  $time ]($style)'

[character]
success_symbol = "[❯](fg:#a6e3a1)"
error_symbol = "[❯](fg:#e64553)"
