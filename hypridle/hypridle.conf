# === HYPRIDLE ===
# Lockea con hyprlock antes de cualquier suspend (incluyendo cierre de tapa).
# El cierre de tapa lo maneja systemd-logind (default: suspend), y hypridle
# escucha el evento DBus prepare_sleep para lockear antes.

general {
    lock_cmd         = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd  = hyprctl dispatch dpms on
}

# Apagar pantalla a los 5 min de inactividad
listener {
    timeout    = 300
    on-timeout = hyprctl dispatch dpms off
    on-resume  = hyprctl dispatch dpms on
}

# Lockear a los 8 min
listener {
    timeout    = 480
    on-timeout = loginctl lock-session
}

# Suspender a los 20 min
listener {
    timeout    = 1200
    on-timeout = systemctl suspend
}
