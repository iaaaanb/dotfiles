windowrule {
    name = suppress-maximize-events
    match:class = .*
    suppress_event = maximize
}

windowrule {
    name = fix-xwayland-drags
    match:class       = ^$
    match:title       = ^$
    match:xwayland    = true
    match:float       = true
    match:fullscreen  = false
    match:pin         = false
    no_focus = true
}

windowrule { name = float-pavucontrol; match:class = pavucontrol;     float = yes; size = 600 400; }
windowrule { name = float-nm-connect;  match:class = nm-connection-editor; float = yes; }
windowrule { name = float-blueman;     match:class = blueman-manager; float = yes; }
windowrule { name = float-file-dialog; match:title = ^(Open File|Save File|Save As)$; float = yes; }
