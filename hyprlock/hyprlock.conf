# === HYPRLOCK ===
# Reloj grande sobre wallpaper, password discreto abajo

general {
    disable_loading_bar = true
    grace = 0
    hide_cursor = true
    no_fade_in = false
    no_fade_out = false
}

# === Wallpaper de fondo ===
background {
    monitor =
    path = /home/ian/Pictures/wallpapers/wpp.png
    blur_passes = 2
    blur_size = 7
    contrast = 0.9
    brightness = 0.7
    vibrancy = 0.15
}

# === Reloj GRANDE arriba al centro ===
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(e6e6e6ff)
    font_size = 140
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 200
    halign = center
    valign = center
}

# === Fecha bajo el reloj ===
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %B %d')"
    color = rgba(a8a8a8ff)
    font_size = 22
    font_family = JetBrainsMono Nerd Font
    position = 0, 80
    halign = center
    valign = center
}

# === Avatar / nombre de usuario (mediano, arriba del input) ===
label {
    monitor =
    text =   $USER
    color = rgba(cdd6f4ff)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 0, -150
    halign = center
    valign = center
}

# === Input de password (discreto, abajo) ===
input-field {
    monitor =
    size = 280, 44
    outline_thickness = 1
    dots_size = 0.25
    dots_spacing = 0.4
    dots_center = true
    dots_rounding = -1
    outer_color = rgba(404040cc)
    inner_color = rgba(00000099)
    font_color = rgba(e6e6e6ff)
    fade_on_empty = true
    fade_timeout = 1000
    placeholder_text = <span foreground="##707070">password</span>
    hide_input = false
    rounding = 12
    check_color = rgba(f35638ff)
    fail_color = rgba(f38ba8ff)
    fail_text = <i>$FAIL</i>
    fail_transition = 300
    capslock_color = rgba(f9e2afff)
    numlock_color = -1
    bothlock_color = -1
    invert_numlock = false
    swap_font_color = false
    position = 0, -200
    halign = center
    valign = center
}
